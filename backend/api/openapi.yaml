openapi: 3.0.3
info:
  title: Kindling API
  version: 0.8.0
  description: >
    Holistic Self-Calibration & Anti-Burnout API ("Small sparks, steady fire.").
    Covers Health, Auth, Check-In & AI (incl. brain-dump reflection), 3 Daily Wins (slice-task,
    recalibrate, swap, toggle), Habits, and Profile (heatmap, Milestone Path, Pattern Discovery).
    AI endpoints return `ai_note` (`daily_limit` or `unavailable`) when a deterministic template
    replaced the AI answer.
servers:
  - url: http://localhost/api/v1
    description: Local Docker Compose via NGINX load balancer
  - url: http://localhost:8080/api/v1
    description: Direct API instance
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      tags: [Health]
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            example: ok
  /health/ready:
    get:
      summary: Readiness probe (PostgreSQL & Redis)
      operationId: getHealthReady
      tags: [Health]
      responses:
        "200":
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, postgres, redis]
                        properties:
                          status:
                            type: string
                            example: ready
                          postgres:
                            type: string
                            example: ok
                          redis:
                            type: string
                            example: ok
        "503":
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/register:
    post:
      summary: Register a new user account
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and session cookies issued (access_token, refresh_token, csrf_token)
          headers:
            Set-Cookie:
              description: Sets HttpOnly access_token (15m), HttpOnly refresh_token (7d), and non-HttpOnly csrf_token (7d) with SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthData"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already registered (EMAIL_TAKEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/login:
    post:
      summary: Authenticate with email and password (rate limited 5/min per IP+email)
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated and session cookies issued
          headers:
            Set-Cookie:
              description: Sets HttpOnly access_token (15m), HttpOnly refresh_token (7d), and non-HttpOnly csrf_token (7d) with SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthData"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid credentials (generic error message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Login rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/me:
    get:
      summary: Get currently authenticated user
      operationId: getMe
      tags: [Auth]
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthData"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/refresh:
    post:
      summary: Rotate refresh token and issue new session cookies (with reuse detection & 10s grace period)
      operationId: refreshSession
      tags: [Auth]
      security:
        - RefreshTokenCookie: []
          CSRFHeader: []
      responses:
        "200":
          description: Session rotated and new cookies issued
          headers:
            Set-Cookie:
              description: Rotated access_token, refresh_token, and csrf_token cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RefreshData"
        "401":
          description: Missing, expired, grace-period parallel, or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/logout:
    post:
      summary: Revoke active refresh token family and clear session cookies
      operationId: logout
      tags: [Auth]
      security:
        - CSRFHeader: []
      responses:
        "200":
          description: Logged out and cookies cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LogoutData"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /checkin:
    post:
      summary: Submit or update daily psychometric check-in and generate calibrated cope options & 3 daily wins (AI rate limited 10/min/user)
      operationId: submitCheckin
      tags: [CheckIn]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID identifying this mutation for idempotent replay (PRD §7.0)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinRequest"
      responses:
        "200":
          description: Check-in scored, calibrated, and saved (or replayed from idempotency store); ai_note is set when the template replaced the AI
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CheckinData"
        "400":
          description: Validation error (answers, text length, or Idempotency-Key format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Re-check-in locked after completing a win (CHECKIN_LOCKED) or key still processing (IDEMPOTENCY_IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Date out of range (DATE_OUT_OF_RANGE) or idempotency key reused with different body (IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: AI rate limit exceeded (10 req/min/user)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /checkin/today:
    get:
      summary: Get today's daily check-in log (calculated in user's timezone)
      operationId: getCheckinToday
      tags: [CheckIn]
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Today's daily check-in log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DailyLog"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No check-in log exists for today (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /checkin/{date}:
    get:
      summary: Get daily check-in log for a specific date (YYYY-MM-DD)
      operationId: getCheckinByDate
      tags: [CheckIn]
      security:
        - AccessTokenCookie: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
      responses:
        "200":
          description: Daily check-in log for the requested date
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DailyLog"
        "400":
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No check-in log exists for the requested date (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /checkin/{date}/cope:
    patch:
      summary: Choose or change the active positive cope option for today/yesterday
      operationId: choosePositiveCope
      tags: [CheckIn]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopeUpdateRequest"
      responses:
        "200":
          description: Chosen cope option title saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CopeUpdateData"
        "400":
          description: Invalid cope_option_id or date format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Check-in log not found for date (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Date is not today or yesterday in user's timezone (DATE_OUT_OF_RANGE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /checkin/{date}/reflect:
    post:
      summary: Read a brain dump back as a short AI reflection (explicit consent, text never stored; AI rate limited 10/min/user)
      description: >
        Sends the user's brain dump to the AI provider for one reflection, only when `consent` is true.
        The text is not stored in the database, not logged, and not part of the response; ai_audit_logs
        records metadata only and the idempotency cache keeps a SHA-256 body hash plus the response.
        Crisis phrases skip the AI entirely and return an empathetic template with safety_flag true.
        When the daily AI quota is used up or the provider fails, a deterministic template that never
        copies the text is returned with ai_note.
      operationId: reflectBrainDump
      tags: [CheckIn]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID identifying this request for idempotent replay (PRD §7.0)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectRequest"
      responses:
        "200":
          description: Reflection (AI, fallback template, or crisis template)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReflectData"
        "400":
          description: Validation error (text length, consent not true, date format, or Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Check-in log not found for date (NOT_FOUND); its tier sets the tone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Idempotency key currently processing (IDEMPOTENCY_IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Date out of range (DATE_OUT_OF_RANGE) or key reused with different body (IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: AI rate limit exceeded (10 req/min/user)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /wins/{date}/slice-task:
    post:
      summary: Slice a work task into a 5–10 minute micro-step via AI Task Slicer (AI rate limited 10/min/user)
      operationId: sliceWorkTask
      tags: [Wins]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID identifying this mutation for idempotent replay (PRD §7.0)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SliceTaskRequest"
      responses:
        "200":
          description: >
            Task sliced into a micro-step and saved to wins_data.work. With next_step true the server
            reads the stored main_task and current micro_step (never the client's) and returns the
            following step with steps_done incremented.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SliceTaskData"
        "400":
          description: Validation error (main_task, next_step without a current micro-step, date format, or Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Check-in log not found for date (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Idempotency key currently processing (IDEMPOTENCY_IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Date out of range (DATE_OUT_OF_RANGE) or key reused with different body (IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: AI rate limit exceeded (10 req/min/user)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /wins/{date}/recalibrate:
    post:
      summary: Dynamically lower the scale of a daily win pillar by one level (0 -> 3) using lock-free AI + FOR UPDATE version check (AI rate limited 10/min/user)
      operationId: recalibrateWin
      tags: [Wins]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID identifying this mutation for idempotent replay (PRD §7.0)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecalibrateRequest"
      responses:
        "200":
          description: Pillar recalibrated to a gentler level and completed reset to false
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RecalibrateData"
        "400":
          description: Validation error (pillar, date format, or Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Check-in log not found for date (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Concurrent level modification (CONCURRENT_MODIFICATION) or key processing (IDEMPOTENCY_IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Already at level 3 (MIN_LEVEL_REACHED), date out of range (DATE_OUT_OF_RANGE), or key reused with different body (IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: AI rate limit exceeded (10 req/min/user)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /wins/{date}/swap:
    post:
      summary: Trade a physical or soul win for another activity, for today only (AI rate limited 10/min/user)
      operationId: swapWin
      tags: [Wins]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID identifying this mutation for idempotent replay (PRD §7.0)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapWinRequest"
      responses:
        "200":
          description: The pillar's new win, built from the activity; the standing habit is unchanged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SwapWinData"
        "400":
          description: Validation error (pillar must be physical or soul, activity 1-120 chars, win already done, date or Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Check-in log not found for date (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Key still processing (IDEMPOTENCY_IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Date out of range (DATE_OUT_OF_RANGE) or key reused with different body (IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: AI rate limit exceeded (10 req/min/user)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /wins/{date}/progress:
    patch:
      summary: Record how many roadmap steps of a physical or soul win are done; completed follows the floor step
      operationId: setStepProgress
      tags: [Wins]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepProgressRequest"
      responses:
        "200":
          description: Progress saved; completed is steps_done >= floor_step and wins_completed_count is recomputed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StepProgressData"
        "400":
          description: Validation error (pillar, steps_done out of range, or the win has no roadmap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Check-in log not found for date (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Date out of range (DATE_OUT_OF_RANGE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /wins/{date}/steps/split:
    post:
      summary: Split the current roadmap step into 2 smaller ones ("Too big? Make it smaller"; AI rate limited 10/min/user)
      operationId: splitStep
      tags: [Wins]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID identifying this mutation for idempotent replay (PRD §7.0)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitStepRequest"
      responses:
        "200":
          description: The roadmap after the split; the floor moves with a split at or before it
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SplitStepData"
        "400":
          description: Validation error (pillar, step is not the current one, the roadmap already has 8 steps, or the win has no roadmap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Check-in log not found for date (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The roadmap changed while the AI was answering (CONCURRENT_MODIFICATION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Date out of range (DATE_OUT_OF_RANGE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: AI rate limit exceeded (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /wins/{date}/toggle:
    patch:
      summary: Transactionally toggle a daily win pillar completion status and recompute wins_completed_count
      operationId: toggleWin
      tags: [Wins]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-26"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleWinRequest"
      responses:
        "200":
          description: Win pillar toggled and wins_completed_count recomputed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ToggleWinData"
        "400":
          description: Validation error (pillar, completed, or date format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Check-in log not found for date (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Date out of range (DATE_OUT_OF_RANGE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /habits:
    get:
      summary: The user's standing habits, one per pillar, that each day's wins are built from
      operationId: getHabits
      tags: [Habits]
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Habits per pillar (null where none is set)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HabitsData"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      summary: Replace all three habits at once; a null or empty activity clears that pillar
      operationId: putHabits
      tags: [Habits]
      security:
        - AccessTokenCookie: []
          CSRFHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitsData"
      responses:
        "200":
          description: The stored habits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HabitsData"
        "400":
          description: Validation error (activity over 120 or struggle over 200 characters, malformed body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid X-CSRF-Token header (CSRF_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /profile/heatmap:
    get:
      summary: Get 365-day anti-burnout heatmap (in user's timezone), lifetime cumulative milestones, and per-pillar Milestone Path
      operationId: getProfileHeatmap
      tags: [Profile]
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: 365-day heatmap entries, lifetime milestones, and lifetime pillar_progress
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HeatmapData"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /profile/insights:
    get:
      summary: Pattern Discovery from the user's own check-ins of the last 90 days (at most 3 insights, each with its sample size)
      description: >
        Reads the last 90 days of the user's check-ins (in the user's timezone). Needs at least
        7 days of data; below that, insights is empty. Each insight is worded as a tendency and
        carries the number of days it is based on. Not an AI endpoint.
      operationId: getProfileInsights
      tags: [Profile]
      security:
        - AccessTokenCookie: []
      responses:
        "200":
          description: Insights (possibly empty) with the analysis window and the number of days analyzed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InsightsData"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    AccessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
    CSRFHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, full_name, ai_consent]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: "alice@kindling.app"
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          example: "correct-horse-battery"
        full_name:
          type: string
          minLength: 1
          maxLength: 120
          example: "Alice Kindling"
        timezone:
          type: string
          maxLength: 64
          default: "Asia/Jakarta"
          example: "Asia/Jakarta"
        ai_consent:
          type: boolean
          enum: [true]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "alice@kindling.app"
        password:
          type: string
          format: password
          example: "correct-horse-battery"
    User:
      type: object
      required: [id, email, full_name, timezone]
      properties:
        id:
          type: string
          format: uuid
          example: "0193a8f2-1234-7000-8000-abcdef123456"
        email:
          type: string
          format: email
          example: "alice@kindling.app"
        full_name:
          type: string
          example: "Alice Kindling"
        timezone:
          type: string
          example: "Asia/Jakarta"
    AuthData:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    RefreshData:
      type: object
      required: [refreshed]
      properties:
        refreshed:
          type: boolean
          enum: [true]
    LogoutData:
      type: object
      required: [logged_out]
      properties:
        logged_out:
          type: boolean
          enum: [true]
    CheckinAnswers:
      type: object
      additionalProperties: false
      required: [cbi_1, cbi_2, cbi_3, olbi_ex_1, olbi_ex_2, olbi_dis_1, olbi_dis_2, who5_1, who5_2]
      properties:
        cbi_1: { type: integer, minimum: 1, maximum: 4 }
        cbi_2: { type: integer, minimum: 1, maximum: 4 }
        cbi_3: { type: integer, minimum: 1, maximum: 4 }
        olbi_ex_1: { type: integer, minimum: 1, maximum: 4 }
        olbi_ex_2: { type: integer, minimum: 1, maximum: 4 }
        olbi_dis_1: { type: integer, minimum: 1, maximum: 4 }
        olbi_dis_2: { type: integer, minimum: 1, maximum: 4 }
        who5_1: { type: integer, minimum: 1, maximum: 4 }
        who5_2: { type: integer, minimum: 1, maximum: 4 }
    CheckinRequest:
      type: object
      required: [log_date, answers]
      properties:
        log_date:
          type: string
          format: date
          example: "2026-11-26"
        answers:
          $ref: "#/components/schemas/CheckinAnswers"
        brain_dump:
          type: string
          maxLength: 2000
        fun_cope_input:
          type: string
          maxLength: 200
    Scores:
      type: object
      required: [physical_exhaustion, work_exhaustion, disengagement, soul_wellbeing]
      properties:
        physical_exhaustion: { type: integer, minimum: 0, maximum: 100 }
        work_exhaustion: { type: integer, minimum: 0, maximum: 100 }
        disengagement: { type: integer, minimum: 0, maximum: 100 }
        soul_wellbeing: { type: integer, minimum: 0, maximum: 100 }
    CopeOption:
      type: object
      required: [id, title, brief_cope_category, tool_type, duration_seconds, guidance]
      properties:
        id: { type: string, example: "cope_1" }
        title: { type: string, maxLength: 80 }
        brief_cope_category:
          type: string
          enum:
            - active_coping
            - planning
            - positive_reframing
            - acceptance
            - humor
            - religion
            - emotional_support
            - instrumental_support
            - self_distraction
            - venting
        tool_type:
          type: string
          enum: [breathing, timer, brain_dump]
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 600
        guidance:
          type: string
          maxLength: 240
    WinItem:
      type: object
      required: [title, duration_seconds, level, completed]
      properties:
        title: { type: string, maxLength: 80 }
        why_this: { type: string, maxLength: 240, description: "Why this win fits today's scores; replaced by a fixed line after recalibrate. Absent on older logs." }
        steps:
          type: array
          maxItems: 8
          description: "A roadmap of 3-5 ordered steps toward the activity (up to 8 after splits), or 2 micro-steps on older logs; emptied after recalibrate."
          items: { type: string, maxLength: 120 }
        duration_seconds: { type: integer, minimum: 60, maximum: 3600, nullable: true, description: "Activity timer; null after recalibrate (timer hidden)" }
        level: { type: integer, minimum: 0, maximum: 3 }
        completed: { type: boolean }
        habit: { type: string, maxLength: 120, description: "The activity this win was built from (habit or today's swap)" }
        swapped: { type: boolean, description: "True when traded for another activity, today only" }
        floor_step: { type: integer, minimum: 1, description: "Set on a roadmap: the 1-based step that counts as showing up; completed is steps_done >= floor_step. Absent on older logs and after recalibrate." }
        steps_done: { type: integer, minimum: 0, description: "Roadmap steps done today; omitted when 0. Done steps short of the floor read as started in the history." }
    WorkWinItem:
      type: object
      required: [title, level, completed, main_task, micro_step, duration_seconds]
      properties:
        title: { type: string, maxLength: 80 }
        level: { type: integer, minimum: 0, maximum: 3 }
        completed: { type: boolean }
        why_this: { type: string, maxLength: 240 }
        steps:
          type: array
          maxItems: 2
          items: { type: string, maxLength: 120 }
        main_task: { type: string, nullable: true }
        micro_step: { type: string, nullable: true }
        duration_seconds: { type: integer, nullable: true, description: "The plan's length at first, the micro-step's once sliced" }
        steps_done: { type: integer, minimum: 0, description: "Micro-steps finished before the current one (progressive slicing); omitted when 0" }
        habit: { type: string, maxLength: 120, description: "The habit this win was built from" }
    WinsData:
      type: object
      required: [physical, work, soul]
      properties:
        physical: { $ref: "#/components/schemas/WinItem" }
        work: { $ref: "#/components/schemas/WorkWinItem" }
        soul: { $ref: "#/components/schemas/WinItem" }
    DailyLog:
      type: object
      required:
        - id
        - log_date
        - scores
        - calibration_tier
        - diagnostic_summary
        - safety_flag
        - cope_options
        - positive_cope_chosen
        - wins_data
        - wins_completed_count
      properties:
        id: { type: string, format: uuid }
        log_date: { type: string, format: date }
        scores: { $ref: "#/components/schemas/Scores" }
        calibration_tier: { type: string, enum: [gentle, balanced, standard] }
        diagnostic_summary: { type: string }
        safety_flag: { type: boolean }
        cope_options:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/CopeOption" }
        positive_cope_chosen: { type: string, nullable: true }
        wins_data: { $ref: "#/components/schemas/WinsData" }
        wins_completed_count: { type: integer, minimum: 0, maximum: 3 }
    CheckinData:
      description: The saved daily log as returned by POST /checkin.
      allOf:
        - $ref: "#/components/schemas/DailyLog"
        - type: object
          properties:
            ai_note:
              type: string
              enum: [daily_limit, unavailable]
              description: Set when the deterministic template replaced the AI answer.
    CopeUpdateRequest:
      type: object
      required: [cope_option_id]
      properties:
        cope_option_id:
          type: string
          example: "cope_2"
    CopeUpdateData:
      type: object
      required: [positive_cope_chosen]
      properties:
        positive_cope_chosen:
          type: string
          example: "Pernapasan 4-7-8"
    ReflectRequest:
      type: object
      required: [text, consent]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: The brain dump. Used for this one reflection only; never stored or logged.
          example: "Too many deadlines this week and I keep sleeping late."
        consent:
          type: boolean
          enum: [true]
          description: Must be true; the user explicitly chose "Read it back to me".
    ReflectData:
      type: object
      required: [reflection, themes, safety_flag]
      properties:
        reflection:
          type: string
          maxLength: 280
        themes:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 40
        safety_flag:
          type: boolean
          description: True when crisis phrases were found; the AI was not called and the UI shows support lines.
        ai_note:
          type: string
          enum: [daily_limit, unavailable]
          description: Set when the deterministic template replaced the AI answer.
    SliceTaskRequest:
      type: object
      required: [main_task]
      properties:
        main_task:
          type: string
          minLength: 1
          maxLength: 300
          example: "Menyelesaikan laporan praktikum jaringan komputer bab 3"
        next_step:
          type: boolean
          default: false
          description: >
            True after the user finished the current micro-step: the server uses the stored
            main_task and micro_step to plan the next one. Needs an existing micro-step (400 otherwise).
    SliceTaskData:
      type: object
      required: [main_task, micro_step, duration_seconds, steps_done]
      properties:
        main_task:
          type: string
        micro_step:
          type: string
          maxLength: 240
        duration_seconds:
          type: integer
          minimum: 300
          maximum: 600
        steps_done:
          type: integer
          minimum: 0
          description: Micro-steps finished before this one (0 for a fresh slice).
        ai_note:
          type: string
          enum: [daily_limit, unavailable]
          description: Set when the deterministic template replaced the AI answer.
    Habit:
      type: object
      required: [activity, struggle]
      properties:
        activity: { type: string, maxLength: 120 }
        struggle: { type: string, maxLength: 200, description: "What usually gets in the way; may be empty" }
    HabitsData:
      type: object
      properties:
        physical: { allOf: [{ $ref: "#/components/schemas/Habit" }], nullable: true }
        work: { allOf: [{ $ref: "#/components/schemas/Habit" }], nullable: true }
        soul: { allOf: [{ $ref: "#/components/schemas/Habit" }], nullable: true }
    SwapWinRequest:
      type: object
      required: [pillar, activity]
      properties:
        pillar:
          type: string
          enum: [physical, soul]
        activity: { type: string, minLength: 1, maxLength: 120 }
    SwapWinData:
      type: object
      required: [pillar, win]
      properties:
        pillar:
          type: string
          enum: [physical, soul]
        win: { $ref: "#/components/schemas/WinItem" }
        ai_note:
          type: string
          enum: [daily_limit, unavailable]
          description: Set when the deterministic template replaced the AI answer.
    RecalibrateRequest:
      type: object
      required: [pillar]
      properties:
        pillar:
          type: string
          enum: [physical, work, soul]
    RecalibrateData:
      type: object
      required: [pillar, new_title, level]
      properties:
        pillar:
          type: string
          enum: [physical, work, soul]
        new_title:
          type: string
          maxLength: 80
        level:
          type: integer
          minimum: 1
          maximum: 3
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 600
          description: Only for the work pillar once sliced; capped at 300/180/60 seconds for levels 1/2/3.
        ai_note:
          type: string
          enum: [daily_limit, unavailable]
          description: Set when the deterministic template replaced the AI answer.
    ToggleWinRequest:
      type: object
      required: [pillar, completed]
      properties:
        pillar:
          type: string
          enum: [physical, work, soul]
        completed:
          type: boolean
    ToggleWinData:
      type: object
      required: [pillar, completed, wins_completed_count]
      properties:
        pillar:
          type: string
          enum: [physical, work, soul]
        completed:
          type: boolean
        wins_completed_count:
          type: integer
          minimum: 0
          maximum: 3
    StepProgressRequest:
      type: object
      additionalProperties: false
      required: [pillar, steps_done]
      properties:
        pillar: { type: string, enum: [physical, soul] }
        steps_done: { type: integer, minimum: 0, description: "At most the number of steps in the roadmap" }
    StepProgressData:
      type: object
      required: [pillar, steps_done, completed, wins_completed_count]
      properties:
        pillar: { type: string, enum: [physical, soul] }
        steps_done: { type: integer, minimum: 0 }
        completed: { type: boolean }
        wins_completed_count: { type: integer, minimum: 0, maximum: 3 }
    SplitStepRequest:
      type: object
      additionalProperties: false
      required: [pillar, step]
      properties:
        pillar: { type: string, enum: [physical, soul] }
        step: { type: integer, minimum: 0, description: "0-based index of the step to split; must equal steps_done" }
    SplitStepData:
      type: object
      required: [pillar, steps, floor_step, steps_done]
      properties:
        pillar: { type: string, enum: [physical, soul] }
        steps:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 120 }
        floor_step: { type: integer, minimum: 1 }
        steps_done: { type: integer, minimum: 0 }
        ai_note:
          type: string
          enum: [daily_limit, unavailable]
          description: Set when the deterministic template replaced the AI answer.
    HeatmapRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
          example: "2025-11-27"
        to:
          type: string
          format: date
          example: "2026-11-26"
    ProfileMilestones:
      type: object
      required: [total_active_days, total_complete_days, total_recovery_days, total_daily_wins, total_checkpoints]
      properties:
        total_active_days:
          type: integer
          minimum: 0
        total_complete_days:
          type: integer
          minimum: 0
        total_recovery_days:
          type: integer
          minimum: 0
        total_daily_wins:
          type: integer
          minimum: 0
        total_checkpoints:
          type: integer
          minimum: 0
          description: Sum of checkpoints across the three pillars (lifetime).
    PillarCheckpoint:
      type: object
      required: [number, reached_on]
      properties:
        number:
          type: integer
          minimum: 1
        reached_on:
          type: string
          format: date
          description: The log date on which this pillar's (3 x number)-th win was completed.
          example: "2026-11-20"
    PillarProgress:
      type: object
      description: >
        One pillar's lifetime Milestone Path, computed from daily_logs.wins_data. Past days are
        locked (mutations only on today/yesterday), so it only moves forward or stays still;
        it drops only when the user unticks a win on that same day.
      required: [completed_total, checkpoints, next_checkpoint_at, last_completed_on]
      properties:
        completed_total:
          type: integer
          minimum: 0
          example: 7
        checkpoints:
          type: array
          description: One entry per 3 completed wins, ordered by date.
          items:
            $ref: "#/components/schemas/PillarCheckpoint"
        next_checkpoint_at:
          type: integer
          minimum: 3
          description: Completed-win count at which the next checkpoint opens.
          example: 9
        last_completed_on:
          type: string
          format: date
          nullable: true
          example: "2026-11-26"
    PillarProgressSet:
      type: object
      required: [physical, work, soul]
      properties:
        physical:
          $ref: "#/components/schemas/PillarProgress"
        work:
          $ref: "#/components/schemas/PillarProgress"
        soul:
          $ref: "#/components/schemas/PillarProgress"
    HeatmapDay:
      type: object
      required: [date, level, wins_count, cope_chosen]
      properties:
        date:
          type: string
          format: date
          example: "2026-11-26"
        level:
          type: string
          enum: [rest, recovery, steady, complete]
        wins_count:
          type: integer
          minimum: 0
          maximum: 3
        cope_chosen:
          type: string
          nullable: true
          example: "Pernapasan 4-7-8"
    HeatmapData:
      type: object
      required: [range, milestones, days, pillar_progress]
      properties:
        range:
          $ref: "#/components/schemas/HeatmapRange"
        milestones:
          $ref: "#/components/schemas/ProfileMilestones"
        days:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapDay"
        pillar_progress:
          $ref: "#/components/schemas/PillarProgressSet"
    Insight:
      type: object
      required: [id, kind, headline, detail, sample_size]
      properties:
        id:
          type: string
          example: "weekday-peak"
        kind:
          type: string
          enum: [weekday_peak, cope_next_day, exhaustion_trend, recovery_days]
        headline:
          type: string
          example: "Your physical exhaustion tends to peak on Mondays"
        detail:
          type: string
        sample_size:
          type: integer
          minimum: 1
          description: Number of days this insight is based on.
    InsightsData:
      type: object
      required: [window_days, days_analyzed, min_days, insights]
      properties:
        window_days:
          type: integer
          example: 90
        days_analyzed:
          type: integer
          minimum: 0
        min_days:
          type: integer
          example: 7
          description: Days of check-ins needed before any insight is shown.
        insights:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/Insight"
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          example: "0193a8f2-1234-7000-8000-abcdef123456"
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - CSRF_INVALID
            - NOT_FOUND
            - EMAIL_TAKEN
            - CHECKIN_LOCKED
            - IDEMPOTENCY_IN_PROGRESS
            - CONCURRENT_MODIFICATION
            - IDEMPOTENCY_KEY_REUSED
            - MIN_LEVEL_REACHED
            - DATE_OUT_OF_RANGE
            - RATE_LIMITED
            - NOT_READY
            - INTERNAL
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/Meta"
